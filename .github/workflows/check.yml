# Skill repo CI (spec §7.7): lint fixtures and build cases (§11 tests 3–4) on every push.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: vvm loads under uv
        run: uv run skills/vocareum-vending-machine/scripts/vvm.py --help
      - name: Tests
        run: uv run --no-project --python 3.12 --with pytest pytest -q tests
