[course]
name = "Hello Vocareum"
slug = "hello-vocareum"
repo_url = "https://github.com/example/hello-vocareum"
environment_version = "4"

[data]
catalog = "hello"
schema = "trips"
learner_group = "account users"

[[setup.steps]]
name = "data_load"
notebook = "setup/00_data_load"
